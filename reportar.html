<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportar Incidente | Help Desk</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header class="header">

    <img src="assets/img/img1.png" alt="Logo del sistema" width="150">

    <h1>Sistema Help Desk</h1>

    <p>Gestión de incidentes informáticos</p>

</header>

<nav>

    <ul>

        <li><a href="index.html">Inicio</a></li>

        <li><a href="reportar.html">Reportar Incidente</a></li>

        <li><a href="tickets.html">Tickets</a></li>

    </ul>

</nav>

<main class="container">

<section class="component">

<h2>Formulario de Reporte</h2>

<p class="descripcion">

Complete el siguiente formulario para registrar un nuevo incidente de soporte técnico.

</p>

<form>

<label for="titulo">Título del incidente</label>

<input
type="text"
id="titulo"
name="titulo"
placeholder="Ingrese el título del incidente"
required>

<label for="categoria">Categoría</label>

<select id="categoria" name="categoria">

<option>Red</option>

<option>Hardware</option>

<option>Software</option>

</select>

<label>Prioridad</label>

<div class="badges">

<label>

<input type="radio" name="prioridad">

Alta

</label>

<label>

<input type="radio" name="prioridad">

Media

</label>

<label>

<input type="radio" name="prioridad">

Baja

</label>

</div>

<label for="descripcion">

Descripción

</label>

<textarea
id="descripcion"
rows="6"
placeholder="Describa el problema presentado"></textarea>

<br>

<button class="btn btn-primary" type="submit">

Enviar Ticket

</button>

</form>

</section>

</main>

<footer>

<p>

© 2026 Help Desk - Sistema de Gestión de Incidentes

</p>

</footer>

</body>

</html>
